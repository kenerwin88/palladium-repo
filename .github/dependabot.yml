version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /app/frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      angular:
        patterns: ["@angular/*"]
      frontend-development:
        dependency-type: development

  - package-ecosystem: pip
    directory: /app/backend
    schedule:
      interval: weekly
      day: monday
    groups:
      backend:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: /terraform/live
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: terraform
    directory: /terraform/bootstrap
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday


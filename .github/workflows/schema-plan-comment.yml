name: Schema plan comment

on: # zizmor: ignore[dangerous-triggers] trusted main only renders a successful CI artifact as text.
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  comment:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: schema-plan-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: /tmp/schema-plan
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Add or update the schema plan comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_FILE: /tmp/schema-plan/schema-plan.md
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/attempts/${{ github.event.workflow_run.run_attempt }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- palladium-schema-plan -->';
            const raw = fs.readFileSync(process.env.PLAN_FILE, 'utf8').replaceAll('@', '@\u200b');
            const plan = raw.length > 58000 ? `${raw.slice(0, 58000)}\n\n... truncated; download the complete schema-plan artifact` : raw;
            const body = `${marker}\n${plan}\n\n[CI evidence and complete artifacts](${process.env.RUN_URL})`;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number});
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({...context.repo, comment_id: previous.id, body});
            } else {
              await github.rest.issues.createComment({...context.repo, issue_number, body});
            }

name: Preview reaper

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: preview-reaper
  cancel-in-progress: false

jobs:
  destroy-expired:
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.8
      - name: Destroy previews past their TTL
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          DATABASE_DEPLOYMENTS_ENABLED: ${{ vars.DATABASE_DEPLOYMENTS_ENABLED }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          FLYWAY_PASSWORD: ${{ secrets.FLYWAY_PASSWORD }}
          FLYWAY_URL: ${{ secrets.FLYWAY_URL }}
          FLYWAY_USER: ${{ secrets.FLYWAY_USER }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          aws lambda list-functions \
            --query "Functions[?starts_with(FunctionName, '${ECR_REPOSITORY}-pr-')].[FunctionName,FunctionArn]" \
            --output text | while read -r name arn; do
              expires_at="$(aws lambda list-tags --resource "$arn" --query 'Tags.ExpiresAt' --output text)"
              if [[ "$expires_at" != "None" && -n "$expires_at" && "$expires_at" < "$now" ]]; then
                preview="${name#${ECR_REPOSITORY}-}"
                ./scripts/ci/destroy.sh "$preview"
              fi
            done

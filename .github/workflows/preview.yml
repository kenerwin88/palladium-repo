name: Preview deploy

on: # zizmor: ignore[dangerous-triggers] trusted main deploys; PR IaC receives only a read-only planning role.
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.meta.outputs.environment }}
      expires_at: ${{ steps.meta.outputs.expires_at }}
      pr_number: ${{ steps.meta.outputs.pr_number }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - id: meta
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "environment=pr-${PR_NUMBER}" >>"$GITHUB_OUTPUT"
          echo "expires_at=$(date -u -d '+7 days' +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"
          echo "pr_number=${PR_NUMBER}" >>"$GITHUB_OUTPUT"
          echo "version=pr-${PR_NUMBER}-${SHA:0:7}" >>"$GITHUB_OUTPUT"

  deploy:
    needs: prepare
    uses: $/.github/workflows/_deploy.yml
    permissions:
      actions: read
      contents: read
      id-token: write
    with:
      credentials_environment: preview
      environment: ${{ needs.prepare.outputs.environment }}
      expires_at: ${{ needs.prepare.outputs.expires_at }}
      infrastructure_ref: main
      run_id: ${{ github.event.workflow_run.id }}
      run_attempt: ${{ github.event.workflow_run.run_attempt }}
      source_sha: ${{ github.event.workflow_run.head_sha }}
      version: ${{ needs.prepare.outputs.version }}

  environment-plans:
    name: Plan ${{ matrix.environment }}
    needs: [prepare, deploy]
    runs-on: ubuntu-latest
    environment: plan
    strategy:
      fail-fast: false
      matrix:
        environment: [development, staging, production]
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false
      - name: Plan the pull request against ${{ matrix.environment }} state
        id: terraform-plan
        continue-on-error: true
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_URI: ${{ needs.deploy.outputs.image_uri }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          ./scripts/ci/plan.sh "${{ matrix.environment }}" "$IMAGE_URI" "$VERSION"
          "/tmp/${{ matrix.environment }}.tfplan" "/tmp/${{ matrix.environment }}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.terraform-plan.outcome == 'success'
        with:
          name: pr-${{ needs.prepare.outputs.pr_number }}-${{ matrix.environment }}-plan-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: /tmp/${{ matrix.environment }}.txt
          if-no-files-found: error
          retention-days: 7
      - name: Add or update the environment plan comment
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          ENVIRONMENT_NAME: ${{ matrix.environment }}
          PLAN_FILE: /tmp/${{ matrix.environment }}.txt
          PLAN_OUTCOME: ${{ steps.terraform-plan.outcome }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        with:
          script: |
            const fs = require('fs');
            const environment = process.env.ENVIRONMENT_NAME;
            const marker = `<!-- palladium-plan-${environment} -->`;
            const succeeded = process.env.PLAN_OUTCOME === 'success';
            const raw = succeeded ? fs.readFileSync(process.env.PLAN_FILE, 'utf8') : 'Terraform could not produce a plan. Open the linked workflow run for the error; the previous plan is no longer current.';
            const plan = raw.length > 55000 ? `${raw.slice(0, 55000)}\n... truncated; download the plan artifact for the complete diff` : raw;
            const icon = succeeded ? '✅' : '❌';
            const body = `${marker}\n### ${icon} If merged: Terraform plan for ${environment}\n\nThis read-only speculative plan compares this PR with the current **${environment}** state. The PR version is a placeholder because the final CalVer is assigned after merge. Nothing is applied from the PR. [Plan run](${process.env.RUN_URL})\n\n<details open><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>`;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }
      - name: Enforce successful Terraform plan
        if: steps.terraform-plan.outcome != 'success'
        run: exit 1

  acceptance:
    needs: [prepare, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd0ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.23.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24.15.0"
          cache: pnpm
          cache-dependency-path: app/frontend/pnpm-lock.yaml
      - run: pnpm --dir app/frontend install --frozen-lockfile
      - run: pnpm --dir app/frontend exec playwright install --with-deps chromium
      - name: Exercise the preview in desktop and mobile Chromium
        env:
          BASE_URL: ${{ needs.deploy.outputs.url }}
        run: pnpm --dir app/frontend e2e

  announce:
    needs: [prepare, deploy, environment-plans, acceptance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Add or update preview comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.url }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          VERSION: ${{ needs.prepare.outputs.version }}
        with:
          script: |
            const marker = '<!-- palladium-preview -->';
            const body = `${marker}\n### Preview ready\n\n| | |\n|---|---|\n| URL | ${process.env.PREVIEW_URL} |\n| Version | \`${process.env.VERSION}\` |\n| Lifetime | Rebuilt on each commit; destroyed when this PR closes |`;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number,
            });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }

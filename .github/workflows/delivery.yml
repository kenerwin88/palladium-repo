name: Delivery

on: # zizmor: ignore[dangerous-triggers] workflow_run uses only a successful main artifact and trusted IaC.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: delivery
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    if: >-
      vars.DEPLOYMENTS_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: version
        env:
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          date_part="$(git show -s --date=format:%Y.%m.%d --format=%cd HEAD)"
          echo "value=${date_part}.${RUN_NUMBER}" >>"$GITHUB_OUTPUT"

  development:
    needs: prepare
    uses: $/.github/workflows/_deploy.yml
    permissions:
      actions: read
      contents: read
      id-token: write
    with:
      credentials_environment: development
      environment: development
      infrastructure_ref: ${{ github.event.workflow_run.head_sha }}
      run_id: ${{ github.event.workflow_run.id }}
      run_attempt: ${{ github.event.workflow_run.run_attempt }}
      source_sha: ${{ github.event.workflow_run.head_sha }}
      version: ${{ needs.prepare.outputs.version }}

  staging:
    needs: [prepare, development]
    uses: $/.github/workflows/_deploy.yml
    permissions:
      actions: read
      contents: read
      id-token: write
    with:
      credentials_environment: staging
      environment: staging
      infrastructure_ref: ${{ github.event.workflow_run.head_sha }}
      run_id: ${{ github.event.workflow_run.id }}
      run_attempt: ${{ github.event.workflow_run.run_attempt }}
      source_sha: ${{ github.event.workflow_run.head_sha }}
      version: ${{ needs.prepare.outputs.version }}

  staging-acceptance:
    needs: [staging]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.23.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          cache: pnpm
          cache-dependency-path: app/frontend/pnpm-lock.yaml
      - run: pnpm --dir app/frontend install --frozen-lockfile
      - run: pnpm --dir app/frontend exec playwright install --with-deps chromium
      - name: Exercise staging in desktop and mobile Chromium
        env:
          BASE_URL: ${{ needs.staging.outputs.url }}
        run: pnpm --dir app/frontend e2e

  production-plan:
    needs: [prepare, staging, staging-acceptance]
    runs-on: ubuntu-latest
    environment: plan
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: vars.DATABASE_DEPLOYMENTS_ENABLED == 'true'
        with:
          name: database-migrations-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: /tmp/database
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false
      - name: Create the exact production plan
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_URI: ${{ needs.staging.outputs.image_uri }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          ./scripts/ci/plan.sh production "$IMAGE_URI" "$VERSION"
          /tmp/production.tfplan /tmp/production.txt
      - name: Create the production database migration plan
        if: vars.DATABASE_DEPLOYMENTS_ENABLED == 'true'
        env:
          CONFIGURED_SCHEMA: ${{ vars.DATABASE_SCHEMA }}
          FLYWAY_PASSWORD: ${{ secrets.FLYWAY_PRODUCTION_PASSWORD }}
          FLYWAY_URL: ${{ secrets.FLYWAY_PRODUCTION_URL }}
          FLYWAY_USER: ${{ secrets.FLYWAY_PRODUCTION_USER }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          : "${FLYWAY_URL:?The plan Environment needs read-only production FLYWAY_URL credentials}"
          schema="${CONFIGURED_SCHEMA:-palladium}"
          [[ "$schema" =~ ^[a-z][a-z0-9_]*$ ]] || { echo "invalid database schema" >&2; exit 64; }
          export FLYWAY_SCHEMAS="$schema" FLYWAY_DEFAULT_SCHEMA="$schema"
          ./scripts/db/plan.sh production /tmp/database/migrations \
            /tmp/production-schema-plan.json /tmp/production-schema-plan.md
      - name: Put the production diff in the run summary
        run: |
          {
            echo "### Production Terraform plan"
            echo
            echo "This is the exact plan the protected production job will apply."
            echo
            echo '<details><summary>Show plan</summary>'
            echo
            echo '```hcl'
            head -c 60000 /tmp/production.txt
            echo
            echo '```'
            echo '</details>'
          } >>"$GITHUB_STEP_SUMMARY"
          if [[ -f /tmp/production-schema-plan.md ]]; then
            cat /tmp/production-schema-plan.md >>"$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/production.tfplan
            /tmp/production.txt
            /tmp/production-schema-plan.json
            /tmp/production-schema-plan.json.sha256
            /tmp/production-schema-plan.md
          if-no-files-found: error
          retention-days: 7

  production:
    needs: [prepare, staging, production-plan]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      url: ${{ steps.apply.outputs.url }}
      image_uri: ${{ needs.staging.outputs.image_uri }}
      database_migration_set_sha256: ${{ steps.database.outputs.migration_set_sha256 }}
      database_plan_sha256: ${{ steps.database.outputs.plan_sha256 }}
      database_record_sha256: ${{ steps.database.outputs.record_sha256 }}
      database_schema_version: ${{ steps.database.outputs.schema_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/production-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: vars.DATABASE_DEPLOYMENTS_ENABLED == 'true'
        with:
          name: database-migrations-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: /tmp/database
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false
      - name: Apply only the reviewed database migration plan
        id: database
        if: vars.DATABASE_DEPLOYMENTS_ENABLED == 'true'
        env:
          CONFIGURED_SCHEMA: ${{ vars.DATABASE_SCHEMA }}
          FLYWAY_PASSWORD: ${{ secrets.FLYWAY_PASSWORD }}
          FLYWAY_URL: ${{ secrets.FLYWAY_URL }}
          FLYWAY_USER: ${{ secrets.FLYWAY_USER }}
        run: |
          : "${FLYWAY_URL:?FLYWAY_URL must be configured on production}"
          schema="${CONFIGURED_SCHEMA:-palladium}"
          [[ "$schema" =~ ^[a-z][a-z0-9_]*$ ]] || { echo "invalid database schema" >&2; exit 64; }
          export FLYWAY_SCHEMAS="$schema" FLYWAY_DEFAULT_SCHEMA="$schema"
          mkdir -p /tmp/production-schema-result
          ./scripts/db/apply-plan.sh production /tmp/database/migrations \
            /tmp/production-plan/production-schema-plan.json \
            /tmp/production-schema-result/schema-deployment.json
      - name: Apply only the reviewed plan and verify production
        id: apply
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_URI: ${{ needs.staging.outputs.image_uri }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          ./scripts/ci/apply-plan.sh production "$VERSION"
          "${{ github.event.workflow_run.id }}" "${{ github.event.workflow_run.run_attempt }}"
          "$IMAGE_URI" /tmp/production-plan/production.tfplan
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.database.outcome == 'success'
        with:
          name: production-schema-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/production-schema-result
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [prepare, development, staging, production]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deployable-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: /tmp/deployable
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: database-migrations-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: /tmp/database
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: vars.DATABASE_DEPLOYMENTS_ENABLED == 'true'
        with:
          name: production-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/release-production-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: vars.DATABASE_DEPLOYMENTS_ENABLED == 'true'
        with:
          name: production-schema-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/release-schema-result
      - name: Create the immutable database migration bundle
        run: |
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            --gzip --create --file=/tmp/database-migrations.tar.gz \
            --directory=/tmp/database migrations
          if [[ -f /tmp/release-production-plan/production-schema-plan.json ]]; then
            cp /tmp/release-production-plan/production-schema-plan.json /tmp/production-schema-plan.json
            cp /tmp/release-schema-result/schema-deployment.json /tmp/schema-deployment.json
          fi
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.9"
          enable-cache: false
      - name: Generate the audit release manifest
        env:
          DATABASE_ENABLED: ${{ vars.DATABASE_DEPLOYMENTS_ENABLED == 'true' && 'true' || 'false' }}
          DATABASE_MIGRATIONS_FILE: /tmp/database-migrations.tar.gz
          DATABASE_MIGRATION_SET_SHA256: ${{ needs.production.outputs.database_migration_set_sha256 || '' }}
          DATABASE_PLAN_SHA256: ${{ needs.production.outputs.database_plan_sha256 || '' }}
          DATABASE_RECORD_SHA256: ${{ needs.production.outputs.database_record_sha256 || '' }}
          DATABASE_SCHEMA_VERSION: ${{ needs.production.outputs.database_schema_version || '' }}
          DEVELOPMENT_URL: ${{ needs.development.outputs.url }}
          DELIVERY_RUN_ATTEMPT: ${{ github.run_attempt }}
          DELIVERY_RUN_ID: ${{ github.run_id }}
          IMAGE_URI: ${{ needs.production.outputs.image_uri }}
          PRODUCTION_URL: ${{ needs.production.outputs.url }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SBOM_FILE: /tmp/deployable/palladium-sbom.cdx.json
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          STAGING_URL: ${{ needs.staging.outputs.url }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          repository_path="${IMAGE_URI%%@*}"
          export ECR_REPOSITORY="${repository_path##*/}"
          if [[ -z "$DATABASE_MIGRATION_SET_SHA256" ]]; then
            export DATABASE_MIGRATION_SET_SHA256="$(./scripts/db/hash-migrations.sh /tmp/database/migrations)"
          fi
          ./scripts/ci/release-manifest.sh /tmp/release-manifest.json
          uvx check-jsonschema==0.38.0 --schemafile docs/release-manifest.schema.json \
            /tmp/release-manifest.json
      - name: Publish calendar-versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          unique_manifest="/tmp/release-manifest-delivery-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}.json"
          cp /tmp/release-manifest.json "$unique_manifest"
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p /tmp/existing-release
            gh release download "v${VERSION}" --pattern release-manifest.json \
              --dir /tmp/existing-release --repo "$GITHUB_REPOSITORY"
            jq -e --arg digest "$(jq -r '.artifact.digest' /tmp/release-manifest.json)" \
              --arg sha "$SHA" \
              '.artifact.digest == $digest and .source.git_sha == $sha' \
              /tmp/existing-release/release-manifest.json >/dev/null
            gh release upload "v${VERSION}" "$unique_manifest" --repo "$GITHUB_REPOSITORY"
          else
            assets=(
              /tmp/release-manifest.json
              /tmp/deployable/palladium-sbom.cdx.json
              /tmp/database-migrations.tar.gz
            )
            [[ -f /tmp/production-schema-plan.json ]] && assets+=(/tmp/production-schema-plan.json)
            [[ -f /tmp/schema-deployment.json ]] && assets+=(/tmp/schema-deployment.json)
            gh release create "v${VERSION}" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --target "$SHA" --generate-notes --title "$VERSION"
          fi

name: Deploy immutable artifact

on:
  workflow_call:
    inputs:
      credentials_environment:
        required: true
        type: string
      environment:
        required: true
        type: string
      expires_at:
        required: false
        type: string
        default: ""
      infrastructure_ref:
        required: true
        type: string
      run_id:
        required: true
        type: string
      run_attempt:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      version:
        required: true
        type: string
    outputs:
      image_uri:
        description: Deployed immutable ECR digest URI
        value: ${{ jobs.deploy.outputs.image_uri }}
      url:
        description: Deployed environment URL
        value: ${{ jobs.deploy.outputs.url }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.credentials_environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      image_uri: ${{ steps.deploy.outputs.image_uri }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.infrastructure_ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deployable-${{ inputs.run_id }}-${{ inputs.run_attempt }}
          path: /tmp/deployable
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: vars.DATABASE_DEPLOYMENTS_ENABLED == 'true'
        with:
          name: database-migrations-${{ inputs.run_id }}-${{ inputs.run_attempt }}
          path: /tmp/database
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Plan, verify, and migrate the database before the application
        id: database
        if: vars.DATABASE_DEPLOYMENTS_ENABLED == 'true'
        env:
          CONFIGURED_SCHEMA: ${{ vars.DATABASE_SCHEMA }}
          FLYWAY_PASSWORD: ${{ secrets.FLYWAY_PASSWORD }}
          FLYWAY_URL: ${{ secrets.FLYWAY_URL }}
          FLYWAY_USER: ${{ secrets.FLYWAY_USER }}
          RUN_ATTEMPT: ${{ inputs.run_attempt }}
          RUN_ID: ${{ inputs.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          : "${FLYWAY_URL:?FLYWAY_URL must be configured on the GitHub Environment}"
          : "${FLYWAY_USER:?FLYWAY_USER must be configured on the GitHub Environment}"
          : "${FLYWAY_PASSWORD:?FLYWAY_PASSWORD must be configured on the GitHub Environment}"
          schema="${CONFIGURED_SCHEMA:-palladium}"
          if [[ "$TARGET_ENVIRONMENT" =~ ^pr-([0-9]+)$ ]]; then
            schema="pr_${BASH_REMATCH[1]}"
          fi
          [[ "$schema" =~ ^[a-z][a-z0-9_]*$ ]] || { echo "invalid database schema" >&2; exit 64; }
          export FLYWAY_SCHEMAS="$schema" FLYWAY_DEFAULT_SCHEMA="$schema"
          mkdir -p /tmp/schema-deployment
          ./scripts/db/plan.sh "$TARGET_ENVIRONMENT" /tmp/database/migrations \
            /tmp/schema-deployment/schema-plan.json /tmp/schema-deployment/schema-plan.md
          cat /tmp/schema-deployment/schema-plan.md >>"$GITHUB_STEP_SUMMARY"
          ./scripts/db/apply-plan.sh "$TARGET_ENVIRONMENT" /tmp/database/migrations \
            /tmp/schema-deployment/schema-plan.json /tmp/schema-deployment/schema-deployment.json
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false
      - name: Deploy and smoke test
        id: deploy
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          EXPIRES_AT: ${{ inputs.expires_at }}
          RUN_ATTEMPT: ${{ inputs.run_attempt }}
          RUN_ID: ${{ inputs.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          VERSION: ${{ inputs.version }}
        run: >-
          ./scripts/ci/deploy.sh "$TARGET_ENVIRONMENT" "$VERSION" "$SOURCE_SHA"
          "$RUN_ID" "$RUN_ATTEMPT" /tmp/deployable/palladium-image.tar "$EXPIRES_AT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.database.outcome == 'success'
        with:
          name: schema-deployment-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/schema-deployment
          if-no-files-found: error
          retention-days: 14

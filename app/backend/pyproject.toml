[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "palladium"
version = "0.1.0"
description = "Reference Flask API for the Palladium delivery example"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.1.3,<4",
  "gunicorn>=26.2,<27",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/palladium"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=palladium --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["palladium"]

